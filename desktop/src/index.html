<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaquita HUD</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="hud-container" id="hudContainer">
    <header class="hud-header" data-tauri-drag-region>
      <div class="hud-brand">
        <span class="hud-logo-icon">✦</span>
        <span class="hud-title">VAQUITA</span>
        <span class="hud-subtitle">// HUD</span>
      </div>
      <div class="hud-header-right">
        <div class="status-orb" id="statusOrb" title="Estado: Listo"></div>
        <span class="hud-shortcut-hint">ESC</span>
      </div>
    </header>

    <div class="hud-input-wrapper">
      <input
        type="text"
        id="promptInput"
        class="hud-input"
        placeholder="Escribe o pide algo..."
        autofocus
        autocomplete="off"
        spellcheck="false"
      />
      <button id="sendBtn" class="hud-send-btn" title="Enviar consulta (Enter)">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

    <div class="hud-response-panel hidden" id="responsePanel">
      <div class="hud-meta-bar">
        <div class="intent-pill" id="intentPill">
          <span class="intent-dot"></span>
          <span class="intent-text" id="intentText">neural // routing</span>
        </div>
        <span class="hud-timestamp" id="hudTimestamp"></span>
      </div>
      <div class="hud-response-content" id="responseContent"></div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
