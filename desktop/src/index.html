<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaquita</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="palette" id="palette">
    <div class="command-bar" data-tauri-drag-region>
      <div class="leading-indicator" data-tauri-drag-region>
        <svg class="prompt-icon" id="promptIcon" viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
        <div class="spinner hidden" id="spinner"></div>
      </div>

      <input
        type="text"
        id="promptInput"
        class="command-input"
        placeholder="Ask Vaquita..."
        autofocus
        autocomplete="off"
        spellcheck="false"
      />

      <div class="bar-actions">
        <button id="micBtn" class="icon-btn" title="Voz (Ctrl+M)" aria-label="Comando de voz">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </button>

        <button id="closeBtn" class="icon-btn" title="Cerrar (Esc)" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <section class="results hidden" id="responsePanel">
      <div class="results-body" id="responseContent"></div>

      <footer class="results-footer">
        <span class="footer-meta" id="footerMeta">vaquita</span>
        <div class="footer-hints">
          <span><kbd>Ctrl</kbd>+<kbd>M</kbd> voz</span>
          <span><kbd>Esc</kbd> cerrar</span>
        </div>
      </footer>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
